shell:
  paths:
    # mise runs in shims mode: no `mise activate` in .zshrc, so this dir is the only
    # thing putting mise-managed tools on PATH. First, so it wins over system copies.
    - path: .local/share/mise/shims
      relative: true
    - path: /usr/local/bin
    - path: .local/bin
      relative: true
    - path: go/bin
      relative: true
    - path: .local/share/aquaproj-aqua/bin
      relative: true
    - path: /Applications/Sublime Text.app/Contents/SharedSupport/bin
      os: darwin

  env:
    AQUA_POLICY_CONFIG: .aqua/aqua-policy.yaml
    EDITOR: micro
    FZF_DEFAULT_COMMAND: fd --type file --color=always
    FZF_DEFAULT_OPTS: --ansi
    FZF_CTRL_T_COMMAND: $FZF_DEFAULT_COMMAND
    FZF_ALT_C_COMMAND: fd --type d --color=always
    GIT_PAGER:
      value: delta
      check: delta
      fallback: less
    OP_BIOMETRIC_UNLOCK_ENABLED: "true"
    DOCKER_CLI_HINTS: "false"

  aliases:
    cat: bat
    ccc: pbcopy
    cu: claude-usage
    ll: eza -la
    ls: eza
    tre: eza -lT --total-size -a
    gaa: git add -A
    gc: git commit
    gd: git diff
    gs: git status
    gg: lazygit
    nano: micro
    s: kitten ssh
    sc: sandy c ml-serve
    sw: sandy cw ml-serve
    sn: sandy new ml-serve
    ss: sandy shared
    sb: sandy build ml-serve
    wtl: git worktree list
    y: yazi
    zj: zellij attach --create
    fzp: fzf --preview "bat --color=always --style=numbers --line-range=:500 {}"

  functions:
    cdg:
      description: cd to git root
      body: cd "$(git rev-parse --show-toplevel)"
    rcp:
      description: copy realpath to clipboard
      body: realpath "${1:-.}" | tr -d '\n' | pbcopy
    _aws_profile:
      description: fzf picker over aws-vault profiles
      body: aws-vault list --profiles | fzf --height=40% --reverse --prompt='aws profile> '
    av:
      description: aws-vault session with self-refreshing credentials
      body: |
        local profile="$1"
        if [[ -z "$profile" ]]; then
          profile=$(_aws_profile) || return
        else
          shift
        fi
        aws-vault exec "$profile" -s "$@"
    avl:
      description: open the AWS console for a profile
      body: |
        local profile="$1"
        if [[ -z "$profile" ]]; then
          profile=$(_aws_profile) || return
        else
          shift
        fi
        aws-vault login "$profile" "$@"
    mkcd:
      description: mkdir and cd into it
      body: mkdir -p "$1" && cd "$1"
    ports:
      description: show listening TCP ports
      body: lsof -iTCP -sTCP:LISTEN -nP
    _repo_rows:
      description: internal - emit picker rows for the given repo roots and their worktrees
      body: |
        # Branch and worktree metadata comes straight off disk, the same trade the
        # prompt makes: ~50 rows with zero forks. Commit dates are the exception,
        # so those forks run in parallel and land in one file each.
        setopt localoptions no_monitor no_notify
        # style `repo` leads with the repo name and follows with the branch; style
        # `wt` leads with the branch, since one repo's list needs no repo column.
        local style=$1; shift
        local d w repo name branch gitdir tdir i=0
        local -A when
        tdir=$(mktemp -d) || return 1
        for d in "$@"; do
          [[ -e $d/.git ]] || continue
          # The counter has to advance here: a redirection on a backgrounded
          # command is expanded by the child, so `$((++i))` there would leave
          # every job writing the same file.
          (( ++i ))
          git --git-dir=$d/.git for-each-ref \
            --format="%(committerdate:unix)"$'\t'"$d"$'\t'"%(refname:short)" refs/heads \
            >$tdir/$i 2>/dev/null &
        done
        wait
        local t dd b f
        for f in $tdir/*(N); do
          while IFS=$'\t' read -r t dd b; do
            when[$dd$'\x1f'$b]=$t
          done <$f
        done
        rm -rf $tdir
        # Branch from HEAD directly, which also handles detached HEAD (raw sha).
        _rr_head() {
          local h
          read -r h <$1/HEAD 2>/dev/null || return 1
          if [[ $h == ref:* ]]; then print -r -- ${h#ref: refs/heads/}; else print -r -- ${h[1,7]}; fi
        }
        for d in "$@"; do
          [[ -e $d/.git ]] || continue
          repo=${d:t}
          branch=$(_rr_head $d/.git) || continue
          if [[ $style == wt ]]; then
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "${d#$HOME/}" "${d#$HOME/}" 0 "$branch" "" "${when[$d$'\x1f'$branch]:-0}"
          else
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "${d#$HOME/}" "${d#$HOME/}" 0 "$repo" "$branch" "${when[$d$'\x1f'$branch]:-0}"
          fi
          for w in $d/.git/worktrees/*(N/); do
            read -r gitdir <$w/gitdir 2>/dev/null || continue
            # A worktree whose checkout is gone is prunable; git still lists it.
            [[ -e $gitdir ]] || continue
            branch=$(_rr_head $w) || continue
            name=${w:t}
            # Same rule as the prompt: the dir is only worth naming when it differs
            # from the branch, which the row already shows.
            [[ $name == $branch ]] && name=""
            # Keyed by the repo, not the worktree: worktrees are ephemeral, so their
            # visits should credit the repo they belong to, and they nest under it.
            if [[ $style == wt ]]; then
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
                "${${gitdir:h}/#$HOME\//}" "${d#$HOME/}" 1 "$branch" "$name" "${when[$d$'\x1f'$branch]:-0}"
            else
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
                "${${gitdir:h}/#$HOME\//}" "${d#$HOME/}" 1 "${name:+$repo/$name}${name:-$repo}" "$branch" "${when[$d$'\x1f'$branch]:-0}"
            fi
          done
        done
        unfunction _rr_head
    _repo_pick:
      description: internal - fzf picker over rows from _repo_rows, cd to the choice
      body: |
        local prompt=$1 rowfile=$2 style=$3
        local hist=${XDG_STATE_HOME:-$HOME/.local/state}/rr/history
        local histread=$hist
        [[ -f $hist ]] || histread=/dev/null
        local now=$(date +%s)
        local sel target
        # Repos rank by frecency, so the common jump is a few letters and Enter,
        # and each repo's worktrees nest directly under it, newest commit first.
        # awk measures and pads plain text, then paints, so no width calculation
        # ever has to see through an escape sequence. Colors match the prompt:
        # bold purple for the repo, pink for the branch, dim for the rest.
        sel=$(awk -F'\t' -v now="$now" -v limit=34 -v style="$style" '
            BEGIN { esc = sprintf("%c", 27)
                    br  = sprintf("%c%c%c", 238, 156, 165) " "
                    if (style == "wt") { g1 = br; c1 = esc "[38;5;212m"; c2 = esc "[38;5;245m" }
                    else               { g2 = br; c1 = esc "[1m" esc "[38;5;141m"; c2 = esc "[38;5;212m" } }
            function pad(k,   s) { s = ""; while (k-- > 0) s = s " "; return s }
            # awk counts bytes, so the multi-byte ellipsis cannot be measured with
            # length(); a clipped string is exactly `room` columns wide.
            function clip(s, room) {
              if (length(s) <= room) return s
              return substr(s, 1, room - 1) sprintf("%c%c%c", 226, 128, 166)
            }
            function ago(t,   d) {
              if (t == 0) return "-"
              d = now - t
              if (d < 3600)    return int(d / 60) "m"
              if (d < 86400)   return int(d / 3600) "h"
              if (d < 604800)  return int(d / 86400) "d"
              if (d < 2592000) return int(d / 604800) "w"
              return int(d / 2592000) "mo"
            }
            NR==FNR {
              n++; p[n] = $1; key[n] = $2; mark[n] = $3
              nm[n] = $4; brn[n] = $5; tim[n] = $6
              w = length($4) + ($3 ? 2 : 0)
              if (w > limit) w = limit
              if (w > max1) max1 = w
              w = length($5)
              if (w > limit) w = limit
              if (w > max2) max2 = w
              next
            }
            { age = now - $1
              if      (age < 3600)   s = 4
              else if (age < 86400)  s = 2
              else if (age < 604800) s = 1
              else                   s = 0.25
              score[$2] += s
            }
            END {
              for (i = 1; i <= n; i++) {
                # One very long name would otherwise set the gap for every row.
                room = limit - (mark[i] ? 2 : 0)
                text = clip(nm[i], room)
                shown = (length(nm[i]) > room ? room : length(nm[i])) + (mark[i] ? 2 : 0)
                second = clip(brn[i], limit)
                sshown = length(brn[i]) > limit ? limit : length(brn[i])
                disp = (mark[i] ? "  " : "") c1 g1 text esc "[0m" pad(max1 - shown + 2) \
                       c2 g2 second esc "[0m" pad(max2 - sshown + 2) \
                       esc "[38;5;245m" ago(tim[i]) esc "[0m"
                printf "%.4f\t%s\t%d\t%d\t%s\t%s\t%s\n", \
                  score[key[i]] + 0, key[i], mark[i], tim[i], p[i], key[i], disp
              }
            }
          ' "$rowfile" "$histread" \
          | sort -t$'\t' -k1,1rn -k2,2 -k3,3n -k4,4rn \
          | cut -f5,6,7 \
          | fzf --ansi --height=40% --reverse --prompt="$prompt" --no-sort \
                --with-nth=3 --delimiter=$'\t' --select-1) || return
        target=${sel%%$'\t'*}
        local repokey=${${sel#*$'\t'}%%$'\t'*}
        mkdir -p "${hist:h}" && printf '%s\t%s\n' "$now" "$repokey" >>"$hist"
        # A worktree outside $HOME keeps its absolute path; everything else is
        # stored relative to $HOME so the frecency key is stable.
        [[ $target == /* ]] && cd "$target" || cd "$HOME/$target"
    rr:
      description: fzf picker over every repo and worktree under ~/altis and ~/mkramers
      body: |
        local rows
        rows=$(_repo_rows repo ~/altis/*(N/) ~/mkramers/*(N/))
        if [[ -z $rows ]]; then
          print -u2 "rr: no repos found in ~/altis or ~/mkramers"
          return 1
        fi
        _repo_pick 'repo> ' <(print -r -- "$rows") repo
    wts:
      description: fzf picker over the current repo and its worktrees
      body: |
        local common
        common=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || {
          print -u2 "wts: not inside a git repository"
          return 1
        }
        _repo_pick 'worktree> ' <(_repo_rows wt "${common:h}") wt
    wth:
      description: cd to the primary worktree root (head of the repo)
      body: cd "$(git worktree list | head -1 | awk '{print $1}')"
    wtr:
      description: fzf picker to remove a git worktree
      body: |
        local sel target
        sel=$(git worktree list | tail -n +2 | fzf --height=40% --reverse --prompt='remove worktree> ') || return
        target=$(echo "$sel" | awk '{print $1}')
        git worktree remove "$target"
    cpo:
      description: fzf picker over recent command blocks in the pane, copies command + output
      body: |
        local dump
        dump=$(mktemp) || return 1
        # Reads the zellij pane's grid, so it needs a reachable zellij server.
        # Works the same on a remote host running its own zellij; what it cannot
        # see is a pane belonging to some other zellij session.
        if ! command -v zellij >/dev/null 2>&1 || ! zellij action dump-screen --full >"$dump" 2>/dev/null; then
          print -u2 "cpo: no reachable zellij session in this pane"
          rm -f "$dump"
          return 1
        fi
        # PROMPT ends in "❯ " and nothing else in it uses that character, so each
        # occurrence marks where a command was typed; the lines up to the next one
        # are that command's output.
        local -a starts labels
        local -i lineno=0 last_content=0
        local line
        while IFS= read -r line; do
          (( lineno++ ))
          [[ -n "${line//[[:space:]]/}" ]] && last_content=$lineno
          if [[ "$line" == *"❯ "* ]]; then
            starts+=( $lineno )
            labels+=( "${line#*❯ }" )
          fi
        done <"$dump"
        if (( ${#starts} == 0 )); then
          print -u2 "cpo: no prompts found in this pane's scrollback"
          rm -f "$dump"
          return 1
        fi
        # Whether the dump reaches the prompt cpo was invoked from depends on
        # timing, so decide by content rather than assuming: if anything follows
        # the last marker it is a finished command, otherwise it is the live
        # prompt and has no output to copy.
        local -i n=${#starts} nblocks
        if (( last_content > starts[n] )); then
          nblocks=$n
        else
          nblocks=$(( n - 1 ))
        fi
        if (( nblocks < 1 )); then
          print -u2 "cpo: no completed commands in this pane's scrollback"
          rm -f "$dump"
          return 1
        fi
        local -a entries
        local -i k e
        for (( k = nblocks; k >= 1; k-- )); do
          if (( k < n )); then
            e=$(( starts[k + 1] - 1 ))
          else
            e=$last_content
          fi
          entries+=( "${starts[k]}:${e}:${labels[k]}" )
        done
        local selected
        selected=$(printf '%s\n' "${entries[@]}" | fzf \
          --multi --delimiter=: --with-nth=3.. --no-sort \
          --prompt='copy> ' --height=70% --reverse \
          --header='enter copies, tab selects several' \
          --preview="sed -n {1},{2}p ${(q)dump}" \
          --preview-window=right:60%:wrap)
        if [[ -z "$selected" ]]; then
          rm -f "$dump"
          return 1
        fi
        # fzf returns newest-first; sort back to chronological so a multi-select
        # pastes in the order the commands actually ran.
        local -a chunks
        local s label block
        while IFS= read -r line; do
          s=${line%%:*}
          line=${line#*:}
          e=${line%%:*}
          label=${line#*:}
          # Command substitution strips trailing newlines, which drops the blank
          # viewport padding at the end of a block for free.
          block=$(sed -n "$(( s + 1 )),${e}p" "$dump")
          chunks+=( '$ '"${label}"$'\n'"${block}" )
        done < <(printf '%s\n' "$selected" | sort -t: -k1,1n)
        rm -f "$dump"

        local payload=${(pj:\n\n:)chunks}
        # A headless box often ships xclip with no X server to talk to, so it is
        # found by command -v yet fails at runtime. Require a display before
        # trusting one, and fall through to the file if the write fails anyway.
        local clip="" c
        for c in pbcopy wl-copy xclip xsel; do
          command -v $c >/dev/null 2>&1 || continue
          case $c in
            wl-copy)    [[ -n "$WAYLAND_DISPLAY" ]] || continue ;;
            xclip|xsel) [[ -n "$DISPLAY" ]] || continue ;;
          esac
          clip=$c
          break
        done
        local -i copied=1
        case $clip in
          pbcopy|wl-copy) printf '%s\n' "$payload" | $clip && copied=0 ;;
          xclip)          printf '%s\n' "$payload" | xclip -selection clipboard && copied=0 ;;
          xsel)           printf '%s\n' "$payload" | xsel --clipboard --input && copied=0 ;;
        esac
        if (( copied == 0 )); then
          print -u2 "cpo: copied ${#chunks} block(s) via $clip"
          return 0
        fi
        # No clipboard tool. Leave the text in a file that is always readable and
        # also try OSC 52, which some terminals turn into a real clipboard write.
        # Zellij is reported not to forward a child process's OSC 52 outward, so
        # the file is the reliable half and the escape is a bonus.
        local out=${TMPDIR:-/tmp}/cpo-${UID}.txt
        printf '%s\n' "$payload" >"$out" || return 1
        if command -v base64 >/dev/null 2>&1 && [[ -w /dev/tty ]]; then
          printf '\033]52;c;%s\007' "$(printf '%s' "$payload" | base64 | tr -d '\n')" >/dev/tty 2>/dev/null
          print -u2 "cpo: no clipboard tool; wrote $out and tried OSC 52"
        else
          print -u2 "cpo: no clipboard tool; wrote $out"
        fi
